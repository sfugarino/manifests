apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langflow-frontend
  namespace: langflow
spec:
  parentRefs:
  - name: langflow
  hostnames:
  - "langflow.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: langflow-service
      port: 8080
