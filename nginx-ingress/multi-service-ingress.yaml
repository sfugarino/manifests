apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-service-ingress
  namespace: default
  annotations:
    # Redirect HTTP to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # TLS certificate issued by cert-manager
    cert-manager.io/cluster-issuer: letsencrypt
    # Increase proxy timeouts for long-running requests (e.g. LLMs)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Increase body size limit if services accept large uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
spec:
  ingressClassName: nginx
  tls:
    # Each host that needs TLS must be listed here.
    # cert-manager will provision a certificate per secretName.
    - hosts:
        - frontend.local
      secretName: frontend-tls
    - hosts:
        - api.local
      secretName: api-tls
    - hosts:
        - dashboard.local
      secretName: dashboard-tls

  rules:
    # ── Host-based routing ──────────────────────────────────────────────────
    # Each virtual host maps to a dedicated backend service.

    - host: frontend.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000

    - host: api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8080

    - host: dashboard.local
      http:
        paths:
          # ── Path-based routing on a single host ─────────────────────────
          # Useful when subdomains are not available or paths are preferred.
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus-service
                port:
                  number: 9090
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-service
                port:
                  number: 80
