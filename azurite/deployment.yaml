apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-azurite-deployment
  namespace: azurite
spec:
  replicas: 1
  selector:
    matchLabels:
      tier: backend
      app: storage-azurite
  template:
    metadata:
      labels:
        tier: backend
        app: storage-azurite
    spec:
      nodeSelector:
        kubernetes.io/hostname: turing-four
      volumes:
      - name: azurite-persistent-storage
        persistentVolumeClaim:
          claimName: azurite-pvc
      - name: azurite-certs
        secret:
          secretName: azurite-certs
      containers:
      - name: storage-azurite-container
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
        - containerPort: 10000
        - containerPort: 10001
        - containerPort: 10002
        args:
          - azurite
          - '--location'
          - '/data'
          - '--blobHost'
          - '0.0.0.0'
          - '--blobPort'
          - '10000'
          - '--queueHost'
          - '0.0.0.0'
          - '--queuePort'
          - '10001'
          - '--tableHost'
          - '0.0.0.0'
          - '--tablePort'
          - '10002'
          - '--debug'
          - '/tmp/debug.log'
          - '--oauth'
          - 'basic'
          - '--cert'
          - '/certs/cert.pem'
          - '--key'
          - '/certs/key.pem'
          - '--debug'
          - '/tmp/debug.log'
          - '--loose'
          - '--disableProductStyleUrl'
          - '--skipApiVersionCheck'
        volumeMounts:
        - name: azurite-persistent-storage
          mountPath: /data
        - name: azurite-certs
          mountPath: /certs
---
apiVersion: v1
kind: Service
metadata:
  name: storage-azurite-service
  namespace: azurite
spec:
  type: LoadBalancer
  ports:
  - name: storage-azurite-blobs
    port: 10000
    targetPort: 10000
  - name: storage-azurite-queues
    port: 10001
    targetPort: 10001
  - name: storage-azurite-tables
    port: 10002
    targetPort: 10002
  selector:
    app: storage-azurite
