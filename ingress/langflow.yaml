apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langflow-ingress
  namespace: langflow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx  # For NGINX Ingress Controller
  rules:
  - host: samland.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langflow
            port:
              number: 8080