apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-mcp-server
  namespace: terraform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terraform-mcp-server
  template:
    metadata:
      labels:
        app: terraform-mcp-server
    spec:
      containers:
      - name: terraform-mcp
        image: hashicorp/terraform-mcp-server:latest
        ports:
        - containerPort: 8080
        env:
        - name: MODE
          value: "http"
        - name: MCP_SESSION_MODE
          value: "stateless"
        - name: MCP_CORS_MODE
          value: "strict"
        - name: TFE_TOKEN
          valueFrom:
            secretKeyRef:
              name: terraform-mcp-secret
              key: tfe-token
        - name: TFE_ORGANIZATION
          valueFrom:
            secretKeyRef:
              name: terraform-mcp-secret
              key: organization
        - name: TF_LOG
          value: "DEBUG"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: terraform-mcp-service
  namespace: terraform
spec:
  selector:
    app: terraform-mcp-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer