# the proxy pod.
hub:
  nodeSelector:
    kubernetes.io/hostname: turing-five
  config:
    Authenticator:
      admin_users:
      - sfugarino2@gmail.com
  db:
    pvc:
      accessModes:
        - ReadWriteOnce
      storage: 10Gi
      storageClassName: local-path
  service:
    type: LoadBalancer

singleuser:
  image:
    name: quay.io/jupyter/pytorch-notebook
    tag: cuda12-latest
  extraResource:
    limits:
      nvidia.com/gpu: "1"
  nodeSelector:
    kubernetes.io/hostname: turing-five
  storage:
    type: dynamic
    capacity: 2Gi
    dynamic:
      storageClass: local-path
  profileList:
  - display_name: "GPU Server"
    description: "Spawns a notebook server with access to a GPU"
    kubespawner_override:
      extra_resource_limits:
        nvidia.com/gpu: "1" 
#   nodeSelector:
#    kubernetes.io/hostname: turing-five                 

# scheduling relates to the user-scheduler pods and user-placeholder pods.
scheduling:
  userScheduler:
    nodeSelector: 
      kubernetes.io/hostname: turing-five

# prePuller relates to the hook|continuous-image-puller DaemonsSets
prePuller:
  hook:
    nodeSelector: 
      kubernetes.io/hostname: turing-five

ingress:
  enabled: false


httpRoute:
  enabled: false
